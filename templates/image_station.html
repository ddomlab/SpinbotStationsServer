<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #888;
        }

        h1 span {
            color: #00e5ff;
        }

        .stream-container {
            position: relative;
            border: 1px solid #222;
            background: #000;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        #stream {
            display: block;
            max-width: min(800px);
            height: auto;
        }

       .button-row {
           display: flex;
           gap: 1rem;
       }

       button {
           appearance: none;
           border: 1px solid #00e5ff;
           background: transparent;
           color: #00e5ff;
           padding: 0.9rem 1.5rem;
           font: inherit;
           cursor: pointer;
           border-radius: 0.35rem;
           transition: background 0.2s ease, color 0.2s ease;
       }

       button:hover,
       button:focus {
           background: #00e5ff;
           color: #0f0f0f;
       }

       footer {
           font-size: 0.75rem;
           color: #444;
           letter-spacing: 0.1em;
       }
    </style>
</head>
<body>
    <header>
        <h1>THIS IS A TEST</h1>
    </header>

    <div class="button-row">
        <button type="button" onclick="customActionOne()">Action One</button>
        <button type="button" onclick="customActionTwo()">Action Two</button>
    </div>

    <div class="stream-container">
        <img id="stream" src="/stream" alt="Live camera feed">
    </div>

    <footer>MJPEG · CAMERA 0 · Live Feed</footer>

    <script>
        function customActionOne() {
            console.log('customActionOne triggered');
            // TODO: implement action one behavior
        }

        function customActionTwo() {
            console.log('customActionTwo triggered');
            // TODO: implement action two behavior
        }
    </script>
</body>
</html>
