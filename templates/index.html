<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 2rem;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #888;
        }

        h1 span {
            color: #00e5ff;
        }

        button {
            appearance: none;
            border: 1px solid #00e5ff;
            background: transparent;
            color: #00e5ff;
            padding: 0.9rem 1.8rem;
            font: inherit;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            border-radius: 0.35rem;
        }

        button:hover,
        button:focus {
            background: #00e5ff;
            color: #0f0f0f;
        }

        footer {
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <header>
        <h1>IMAGE <span>STATION</span></h1>
    </header>

    <button id="live-button" type="button" onclick="window.location.href='/image-station'">
        Image Station
    </button>

    <footer>Go to the live image station feed</footer>
</body>
</html>
